# Configurazione di default. Per personalizzare, crea un file YAML con solo
# le chiavi da cambiare e avvia con:  hand-controller --config mio_profilo.yaml

camera:
  index: 0            # indice webcam
  width: 640
  height: 480
  fps: 30
  mirror: true        # vista "a specchio" (consigliato: i movimenti risultano naturali)
  exposure: null      # null = automatica; es. -6 (DirectShow) per fissarla e tenere 30 fps
  backend: auto       # auto (Media Foundation, riserva DirectShow) | msmf | dshow

tracking:
  max_hands: 2
  min_detection_confidence: 0.6
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  model_path: null    # null = scarica automaticamente in ~/.cache/hand_controller/

filter:               # One Euro filter: min_cutoff basso = più fluido, beta alto = più reattivo
  min_cutoff: 1.2
  beta: 8.0
  d_cutoff: 1.0

gestures:
  pinch_on: 0.30      # distanza pollice-dito / dimensione mano sotto cui il pinch è "premuto"
  pinch_off: 0.42     # isteresi: sopra questa soglia il pinch si rilascia
  curl_open: 1.75     # rapporto dita-polso a mano aperta
  curl_closed: 1.10   # rapporto dita-polso a pugno chiuso

# Gesti personalizzati: una posa della mano tenuta per hold_s secondi esegue un'azione.
# fingers: per ogni dito up (teso) | down (piegato) | any (indifferente)
# trigger: once = una volta per gesto | hold = l'azione resta premuta finché tieni la posa
#          release = una volta, quando abbassi la posa dopo averla tenuta per hold_s
# action.type: app | key | mouse | pad | run   (vedi actions.py per i valori possibili)
custom_gestures:
  - name: Corna = cambia modalità
    enabled: true
    hand: any
    fingers: {thumb: any, index: up, middle: down, ring: down, pinky: up}
    hold_s: 1.0
    trigger: once
    modes: [mouse, gamepad, paused]
    action: {type: app, value: toggle_mode}
  - name: V = pausa / riprendi
    enabled: false
    hand: any
    fingers: {thumb: any, index: up, middle: up, ring: down, pinky: down}
    hold_s: 1.0
    trigger: once
    modes: [mouse, gamepad, paused]
    action: {type: app, value: toggle_pause}
  - name: Telefono = Alt+Tab
    enabled: false
    hand: Right
    fingers: {thumb: up, index: down, middle: down, ring: down, pinky: up}
    hold_s: 0.5
    trigger: once
    modes: [mouse]
    action: {type: key, value: alt+tab}
  - name: Indice alzato = ascolta
    enabled: true
    hand: any
    fingers: {thumb: any, index: up, middle: down, ring: down, pinky: down}
    hold_s: 2.0
    trigger: once
    modes: [mouse, gamepad, paused]
    action: {type: app, value: listen}

# Battiti di mani e schiocchi di dita. Il microfono è spento finché un gesto con l'azione
# "listen" (default: indice alzato per 2 s) non apre la finestra di ascolto.
# Dentro la finestra si contano i colpi secchi; il numero di colpi sceglie l'azione.
audio:
  enabled: true
  device: ""                # vuoto = microfono predefinito di sistema
  window_s: 3.0             # durata massima della finestra di ascolto
  end_after_silence_s: 1.0  # dopo l'ultimo colpo, questo silenzio chiude subito la finestra
  min_level_db: -15         # volume minimo di un colpo (0 = massimo del microfono)
  jump_db: 20               # salita improvvisa minima in 10 ms: distingue i colpi dalla voce
  rise_db: 25               # quanto sopra il rumore di fondo deve arrivare il colpo
  min_gap_ms: 150           # distanza minima tra due colpi (l'eco non conta doppio)
  clap_actions:             # numero di colpi -> azione (null = nessuna)
    "1": {type: key, value: media_play_pause}
    "2": {type: app, value: toggle_mode}
    "3": {type: app, value: toggle_pause}

startup_mode: mouse   # mouse | gamepad | paused

hotkeys:              # tasti globali (funzionano anche col gioco in primo piano)
  toggle_mode: f9
  toggle_pause: f10
  quit: ctrl+f10        # chiude l'app da qualsiasi finestra
  open_config: ""       # vuoto = nessun tasto

auto_switch:
  enabled: true
  # Nome eseguibile (minuscolo) dei giochi: quando sono in primo piano si passa a gamepad,
  # altrimenti si torna al mouse.
  game_processes:
    - witcher3.exe
    - diablo iv.exe

mouse:
  hand: right         # right | left | any
  # anchor   = pugno: il cursore va al centro dello schermo e la mano diventa il centro del
  #            movimento; intorno c'è un rettangolo grande quanto la mano = intero monitor
  #            (piccoli movimenti del polso, gomito appoggiato). Il rettangolo è nell'overlay.
  # absolute = il rettangolo fisso active_region del fotogramma corrisponde all'intero schermo.
  motion: anchor
  anchor:
    span: 1.0             # larghezza del rettangolo in "dimensioni mano" (polso-nocca del medio);
                          # più piccolo = più sensibile. Regolabile con +/- nell'overlay
    recenter_curl: 0.65   # chiusura della mano oltre cui il pugno ricentra
    smoothing:            # filtro sul cursore: min_cutoff basso = più fermo, beta alto = più reattivo
      min_cutoff: 0.8
      beta: 4.0
  # [solo absolute] rettangolo del fotogramma (x0, y0, x1, y1 normalizzati) mappato sull'intero schermo:
  # più piccolo = meno movimento del braccio per attraversare lo schermo
  active_region: [0.25, 0.20, 0.75, 0.65]
  click_freeze_ms: 150    # blocca il cursore subito dopo un pinch per evitare click "spostati"
  scroll_speed: 40        # tacche di scroll per unità di movimento verticale
  bindings:               # pinch pollice + dito -> left | right | middle | double | scroll | null
    index: left           # tenuto premuto = drag
    middle: right
    ring: scroll          # tieni premuto e muovi la mano su/giù
    pinky: middle

gamepad:
  stick:
    radius: 0.8         # spostamento (in "dimensioni mano") per deflessione massima
    deadzone: 0.12
  trigger_threshold: 0.25   # chiusura minima della mano prima che il grilletto inizi a premere
  # Ogni mano: quale stick controlla, cosa fanno i pinch e il pugno.
  # Lo stick si ricentra dove la mano entra nell'inquadratura:
  # per ricentrare basta togliere la mano dal campo visivo e rimetterla.
  left_hand:
    stick: left
    fist: LT
    pinch:
      index: LB
      middle: BACK
      ring: LS
      pinky: START
  right_hand:
    stick: right
    fist: RT
    pinch:
      index: A
      middle: B
      ring: X
      pinky: Y

backend:
  gamepad: auto       # auto | vgamepad | uinput | null
  mouse: auto         # auto | pynput | null

overlay:
  enabled: true
  position: bottom-right   # bottom-right | bottom-left | top-right | top-left
  width: 320               # larghezza in pixel (l'altezza segue le proporzioni della webcam)
  font_scale: 1.0          # grandezza delle scritte (1.5 = più grandi)
  margin: 12               # distanza dai bordi dello schermo / barra delle applicazioni
  always_on_top: false     # true = sempre sopra le altre finestre
